<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
  <title id="t">G.A. Fitness — Geração Ativa</title>
  <desc id="d">Sistema de gerenciamento de academia em Java e MySQL, com uma sessão de terminal mostrando login e menu do gerente.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b100e" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b100e" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="1200" height="560" rx="28" fill="#0b100e"/>
  <rect width="1200" height="560" rx="28" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="560" rx="28" fill="none" stroke="#1d2b24" stroke-width="2"/>

  <!-- coluna esquerda -->
  <g font-family="'Segoe UI', Arial, Helvetica, sans-serif">
    <text x="72" y="112" font-size="20" font-weight="600" letter-spacing="4" fill="#7f9a8b">JAVA · MYSQL · JDBC · DAO</text>
    <text x="68" y="228" font-size="108" font-weight="800" fill="#f4f7f2">G.A.</text>
    <text x="68" y="338" font-size="108" font-weight="800" fill="#a3e635">FITNESS</text>

    <!-- motivo: contagem de séries (marcas de contagem) -->
    <g stroke-linecap="round" stroke-width="9">
      <line x1="76"  y1="372" x2="76"  y2="410" stroke="#a3e635"/>
      <line x1="108" y1="372" x2="108" y2="410" stroke="#a3e635"/>
      <line x1="140" y1="372" x2="140" y2="410" stroke="#a3e635"/>
      <line x1="172" y1="372" x2="172" y2="410" stroke="#a3e635"/>
      <line x1="62"  y1="404" x2="190" y2="378" stroke="#fbbf24"/>
    </g>

    <text x="72" y="466" font-size="34" font-weight="600" letter-spacing="7" fill="#cfe3d6">GERAÇÃO ATIVA</text>
    <text x="72" y="508" font-size="22" fill="#7f9a8b">Alunos, planos, matrículas e treinos,</text>
    <text x="72" y="536" font-size="22" fill="#7f9a8b">gerenciados direto do terminal.</text>
  </g>

  <!-- janela de terminal -->
  <g>
    <rect x="620" y="50" width="520" height="470" rx="18" fill="#060908" stroke="#24362d" stroke-width="2"/>
    <path d="M620 68a18 18 0 0 1 18-18h484a18 18 0 0 1 18 18v32H620z" fill="#111a16"/>
    <circle cx="652" cy="76" r="7" fill="#ff5f57"/>
    <circle cx="678" cy="76" r="7" fill="#febc2e"/>
    <circle cx="704" cy="76" r="7" fill="#28c840"/>
    <text x="736" y="82" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#5f7a6b">gafitness — Main</text>

    <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="20">
      <text x="650" y="138" fill="#f4f7f2">BEM VINDO A G.A. FITNESS</text>
      <text x="650" y="168" fill="#a3e635">&gt; 1</text>
      <text x="650" y="198" fill="#f4f7f2">Email: admin@gafitness.com</text>
      <text x="650" y="228" fill="#f4f7f2">Senha: ********</text>
      <text x="650" y="258" fill="#a3e635">Bem-vindo(a), Admin! Gerente</text>

      <text x="650" y="302" fill="#fbbf24">--- MENU GERENTE ---</text>
      <text x="650" y="332" fill="#9fb8a9">1 - Cadastrar usuário</text>
      <text x="650" y="362" fill="#9fb8a9">2 - Listar usuários</text>
      <text x="650" y="392" fill="#9fb8a9">4 - Cadastrar plano</text>
      <text x="650" y="422" fill="#9fb8a9">6 - Relatório mensal</text>

      <text x="650" y="466" fill="#a3e635">&gt; 6</text>
      <text x="650" y="496" fill="#f4f7f2">Faturamento do mês: R$ 1500,00</text>
    </g>
  </g>
</svg>
